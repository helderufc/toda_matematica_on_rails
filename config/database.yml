default: &default
  adapter: postgresql
  encoding: unicode
  # Desativado para compatibilidade com o PgBouncer em transaction pooling mode.
  prepared_statements: false
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  host:     <%= ENV.fetch("DB_HOST",     "localhost") %>
  port:     <%= ENV.fetch("DB_PORT",     5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: toda_matematica_development

test:
  <<: *default
  database: toda_matematica_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "toda_matematica_production") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "toda_matematica_production") %>
    migrations_paths: db/queue_migrate
